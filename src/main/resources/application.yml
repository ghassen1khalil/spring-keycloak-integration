spring:
  datasource:
    url: jdbc:h2:mem:medicaldb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_URL:http://localhost:8081}/realms/Medical_API

server:
  port: 8080

# Configuration SpringDoc OpenAPI pour Swagger UI
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    path: /swagger-ui
    url: /openapi/swagger.yml

# Configuration des logs verbeux pour tracer les rôles, permissions et accès
logging:
  level:
    root: INFO
    # Logs de sécurité - TRÈS VERBEUX
    com.example.medicalapi.security: DEBUG
    com.example.medicalapi.config: DEBUG
    com.example.medicalapi.api.delegate: INFO
    com.example.medicalapi.service: INFO
    # Spring Security - VERBEUX
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG
    org.springframework.security.access: DEBUG
    org.springframework.security.oauth2.jwt: DEBUG
  pattern:
    console: "[%d{yyyy-MM-dd HH:mm:ss.SSS}] [%-5level] [%logger{36}] - %msg%n"
    file: "[%d{yyyy-MM-dd HH:mm:ss.SSS}] [%-5level] [%logger{36}] - %msg%n"
  file:
    name: logs/medical-api.log
    max-size: 10MB
    max-history: 10

